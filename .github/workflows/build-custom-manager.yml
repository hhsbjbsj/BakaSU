name: Build Custom Manager APK

on:
  workflow_dispatch:
    inputs:
      build_spoofed:
        description: 'Build spoofed package (random package name to bypass machine third-party detection)'
        required: true
        type: boolean
        default: true
      create_release:
        description: 'Create a GitHub Release with built APKs'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - custom-manager-icon
      - 'custom-**'
      - exp-custom-alt-icon
      - 'exp-**'
    paths:
      - 'manager/**'
      - 'userspace/**'
      - 'custom_assets/**'
      - '.github/workflows/build-custom-manager.yml'

jobs:
  build-manager:
    name: Build Custom Manager APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Signing Keystore
        id: sign
        run: |
          KEYSTORE_PATH="$PWD/manager/release-key.jks"
          ALIAS="manager-release"
          STOREPASS="bakasu_2026_pass"
          KEYPASS="bakasu_2026_pass"

          if [ -f "$PWD/manager/custom-release.jks" ]; then
            echo "Using committed permanent custom-release.jks..."
            cp "$PWD/manager/custom-release.jks" "$KEYSTORE_PATH"
            ALIAS="bakasu-custom"
            STOREPASS="bakasu_custom_pass"
            KEYPASS="bakasu_custom_pass"
          elif [ -f "$PWD/custom_assets/keystore/custom-release.jks" ]; then
            echo "Using custom_assets permanent custom-release.jks..."
            cp "$PWD/custom_assets/keystore/custom-release.jks" "$KEYSTORE_PATH"
            ALIAS="bakasu-custom"
            STOREPASS="bakasu_custom_pass"
            KEYPASS="bakasu_custom_pass"
          elif [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Using custom KEYSTORE secret from GitHub Repository Secrets..."
            echo "${{ secrets.KEYSTORE }}" | base64 -d > "$KEYSTORE_PATH"
            ALIAS="${{ secrets.KEY_ALIAS || 'manager-release' }}"
            STOREPASS="${{ secrets.KEYSTORE_PASSWORD || 'bakasu_2026_pass' }}"
            KEYPASS="${{ secrets.KEY_PASSWORD || 'bakasu_2026_pass' }}"
          else
            echo "Generating dedicated persistent release keystore..."
            keytool -genkeypair \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -storepass "$STOREPASS" \
              -keypass "$KEYPASS" \
              -dname "CN=BakaSU Custom Manager, OU=KernelSU, O=Root, L=Global, ST=Global, C=UN" \
              -storetype JKS \
              -keystore "$KEYSTORE_PATH"
          fi

          # Extract Certificate Size and SHA256 Hash
          keytool -exportcert -alias "$ALIAS" -keystore "$KEYSTORE_PATH" -storepass "$STOREPASS" -file cert.der
          CERT_SIZE_DEC=$(stat -c%s cert.der)
          CERT_SIZE_HEX=$(printf '0x%04x' "$CERT_SIZE_DEC")
          CERT_HASH=$(sha256sum cert.der | awk '{print $1}')
          rm -f cert.der

          echo "KEYSTORE_FILE=release-key.jks" >> manager/gradle.properties
          echo "KEY_ALIAS=$ALIAS" >> manager/gradle.properties
          echo "KEYSTORE_PASSWORD=$STOREPASS" >> manager/gradle.properties
          echo "KEY_PASSWORD=$KEYPASS" >> manager/gradle.properties

          echo "CERT_SIZE=$CERT_SIZE_HEX" >> $GITHUB_ENV
          echo "CERT_HASH=$CERT_HASH" >> $GITHUB_ENV

          echo "### 🔑 签名证书特征与安全说明" >> $GITHUB_STEP_SUMMARY
          echo "- **证书尺寸 (Hex Size)**: \`$CERT_SIZE_HEX\` ($CERT_SIZE_DEC bytes)" >> $GITHUB_STEP_SUMMARY
          echo "- **证书 SHA-256 哈希**: \`$CERT_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "- **图标状态**: 已成功替换为二次元专属图标，支持 Adaptive Icon 与标准 Mipmap" >> $GITHUB_STEP_SUMMARY
          echo "- **防报毒/防第三方策略**: Manager 内部已消除非官方警告，同时提供伪装随机包名版防系统应用包拦截" >> $GITHUB_STEP_SUMMARY

      - name: Setup Rust Toolchain for Native ksud
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true
        with:
          toolchain: nightly
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          components: rust-src

      - name: Install cargo-ndk
        continue-on-error: true
        run: |
          cargo install cargo-ndk --locked || true

      - name: Assemble LKM Bootstrap
        continue-on-error: true
        run: |
          clang --target=aarch64-linux-gnu -c -nostdlib \
            -o userspace/ksud/.lkm_image_bootstrap.o \
            userspace/ksud/src/lkm_image_bootstrap.S || true

      - name: Build Native ksud from Source (Relaxed UAPI)
        continue-on-error: true
        run: |
          cd userspace/ksud
          cargo ndk b -P 26 -t aarch64-linux-android -r -Z build-std-features="optimize_for_size" -Z trim-paths || true
          cargo ndk b -P 26 -t armv7-linux-androideabi -r -Z build-std-features="optimize_for_size" -Z trim-paths || true
          cargo ndk b -P 26 -t x86_64-linux-android -r -Z build-std-features="optimize_for_size" -Z trim-paths || true

      - name: Inject Verified ksud Userspace Binaries (UAPI 5 Native)
        run: |
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          mkdir -p manager/app/src/main/jniLibs/armeabi-v7a
          mkdir -p manager/app/src/main/jniLibs/x86_64

          # 1. Check if source compilation succeeded
          if [ -f "userspace/ksud/target/aarch64-linux-android/release/ksud" ]; then
            echo "Injecting freshly compiled ksud from source..."
            cp userspace/ksud/target/aarch64-linux-android/release/ksud manager/app/src/main/jniLibs/arm64-v8a/libksud.so
            [ -f "userspace/ksud/target/armv7-linux-androideabi/release/ksud" ] && cp userspace/ksud/target/armv7-linux-androideabi/release/ksud manager/app/src/main/jniLibs/armeabi-v7a/libksud.so
            [ -f "userspace/ksud/target/x86_64-linux-android/release/ksud" ] && cp userspace/ksud/target/x86_64-linux-android/release/ksud manager/app/src/main/jniLibs/x86_64/libksud.so
          fi

          # 2. Fill missing or all architectures from committed verified UAPI 5 binaries
          if [ ! -f "manager/app/src/main/jniLibs/arm64-v8a/libksud.so" ] && [ -f "custom_assets/jniLibs/arm64-v8a/libksud.so" ]; then
            echo "Injecting verified UAPI 5 ksud from custom_assets/jniLibs/arm64-v8a..."
            cp custom_assets/jniLibs/arm64-v8a/libksud.so manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          fi
          if [ ! -f "manager/app/src/main/jniLibs/armeabi-v7a/libksud.so" ] && [ -f "custom_assets/jniLibs/armeabi-v7a/libksud.so" ]; then
            echo "Injecting verified UAPI 5 ksud from custom_assets/jniLibs/armeabi-v7a..."
            cp custom_assets/jniLibs/armeabi-v7a/libksud.so manager/app/src/main/jniLibs/armeabi-v7a/libksud.so
          fi
          if [ ! -f "manager/app/src/main/jniLibs/x86_64/libksud.so" ] && [ -f "custom_assets/jniLibs/x86_64/libksud.so" ]; then
            echo "Injecting verified UAPI 5 ksud from custom_assets/jniLibs/x86_64..."
            cp custom_assets/jniLibs/x86_64/libksud.so manager/app/src/main/jniLibs/x86_64/libksud.so
          fi

          echo "Verified jniLibs structure:"
          ls -lh manager/app/src/main/jniLibs/*

      - name: Build Standard Release APK (Official Package com.resukisu.resukisu)
        run: |
          cd manager
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../output_apks/standard
          mkdir -p ../output_apks/all
          find app/build/outputs/apk/release/ -type f -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Archiving Standard APK: $filename"
            cp "$apk" "../output_apks/standard/$filename"
            cp "$apk" "../output_apks/all/$filename"
          done

      - name: Build Spoofed Manager APK (Bypass System Blacklist)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_spoofed != 'false' }}
        run: |
          cd manager
          w1=$(tr -dc 'a-z' </dev/urandom | head -c6)
          w2=$(tr -dc 'a-z' </dev/urandom | head -c6)
          w3=$(tr -dc 'a-z' </dev/urandom | head -c6)
          RAND_PKG="${w1}.${w2}.${w3}"
          echo "Building spoofed manager with random package: $RAND_PKG"
          ./gradlew assembleRelease -PKSU_PACKAGE_NAME=$RAND_PKG -PIS_SPOOFED_BUILD=true --stacktrace

          mkdir -p ../output_apks/spoofed
          find app/build/outputs/apk/release/ -type f -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            spoofed_filename="${filename%.apk}_spoofed_${RAND_PKG}.apk"
            echo "Archiving Spoofed APK: $spoofed_filename"
            cp "$apk" "../output_apks/spoofed/$spoofed_filename"
            cp "$apk" "../output_apks/all/$spoofed_filename"
          done

      - name: Verify APK Structure and ksud Injection
        run: |
          echo "=== Output APKs Summary ==="
          ls -lh output_apks/all/
          echo "=== Verifying libksud.so & icons inside output APKs ==="
          for apk in output_apks/all/*.apk; do
            echo ">>> Inspecting $(basename "$apk")"
            unzip -l "$apk" | grep -E "libksud|libkernelsu|mipmap" || true
          done

      - name: Upload Standard APKs (Official Package)
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Standard-Manager-APKs
          path: output_apks/standard/*.apk
          if-no-files-found: error

      - name: Upload Spoofed APKs (Random Package)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_spoofed != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Spoofed-Manager-APKs
          path: output_apks/spoofed/*.apk
          if-no-files-found: ignore

      - name: Upload All Manager APKs
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-Custom-Manager-APKs
          path: output_apks/all/*.apk
          if-no-files-found: error

      - name: Create GitHub Release (If Requested)
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-manager-${{ github.run_number }}
          name: "BakaSU Custom Manager (Build #${{ github.run_number }})"
          body: |
            ### BakaSU 自定义图标 & 防第三方检测管理器
            - **证书大小**: `${{ env.CERT_SIZE }}`
            - **证书 SHA256**: `${{ env.CERT_HASH }}`
            - **说明**: 已替换专属二次元启动图标，移除导致 Android 13+ 闪退的 monochrome 标签，内置 ksud 核心守护程序，界面已解除非官方警告卡片。
          files: output_apks/all/*.apk
